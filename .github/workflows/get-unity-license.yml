name: Ativação e Extração de Licença Unity

on:
  workflow_dispatch:

jobs:
  acquire-license:
    name: Gerar Licença .ulf
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file (.alf)
        id: get-alf
        uses: game-ci/unity-request-activation-file@v2

      - name: Salvar arquivo .alf
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-File
          path: ${{ steps.get-alf.outputs.filePath }}
